# Local full stack: docker compose up --build  →  http://localhost:5173
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routing
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: routing
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build: ./backend
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgres://routing:routing@db:5432/routing
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DJANGO_SSL_REDIRECT: "false"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    volumes: [./frontend:/app, /app/node_modules]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
